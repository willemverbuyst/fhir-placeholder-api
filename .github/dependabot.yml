version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Root of the monorepo
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    versioning-strategy: increase
    allow:
      - dependency-type: "direct"
      
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

