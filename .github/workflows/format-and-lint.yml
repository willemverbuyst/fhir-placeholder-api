name: Format & Lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm i
      - name: check formatting
        run: npm run format:check
      - name: check linting
        run: npm run lint:check
