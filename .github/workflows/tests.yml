name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v6

      - name: 📦 Setup Node and PNPM
        uses: pnpm/action-setup@v5

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "./.nvmrc"
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧪 Run unit tests
        run: pnpm test:unit

      - name: 🧪 Run e2e tests
        run: pnpm test:e2e