<div class="list">
  @for (condition of conditions; track condition.id) {
  <graph-resource-item
    [id]="condition.id"
    (selectedChange)="condition.selected = $event"
  >
    @if(condition.selected) {
    <episode-of-care-resource [conditionId]="condition.id" />
    }</graph-resource-item
  >
  }
</div>
