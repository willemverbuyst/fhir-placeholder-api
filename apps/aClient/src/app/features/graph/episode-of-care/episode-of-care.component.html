<div class="list">
  @for (episode of episodeOfCares; track episode.id) {
  <graph-resource-item
    [id]="episode.id"
    (selectedChange)="episode.selected = $event"
  >
    @if(episode.selected) {
    <encounter-resource [episodeOfCareId]="episode.id" />
    }</graph-resource-item
  >
  }
</div>
