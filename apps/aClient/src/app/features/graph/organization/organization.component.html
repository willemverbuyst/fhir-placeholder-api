<div class="list">
  @for (organization of organizations; track organization.id) {
  <graph-resource-item
    [id]="organization.id"
    (selectedChange)="organization.selected = $event"
  >
    @if(organization.selected) {
    <practitioner-role-resource [organizationId]="organization.id" />
    }
  </graph-resource-item>
  }
</div>
