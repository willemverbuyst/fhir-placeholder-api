<div class="list">
  @for (practitionerRole of practitionerRoles; track practitionerRole.id) {
  <div class="graph">
    <button mat-button (click)="onPractitionerRoleClick(practitionerRole.id)">
      {{ practitionerRole.id }}
    </button>

    @if (practitionerId === practitionerRole.practitionerId) {
    <practitioner-resource [practitionerId]="practitionerId" />
    }
  </div>
  }
</div>
