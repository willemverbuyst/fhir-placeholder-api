services:
  auth-service-db:
    image: postgres:15
    container_name: auth-service-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - auth-service-db-data:/var/lib/postgresql/data

  auth-service-db-tool:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: auth-service-db
    ports:
      - "9090:8080"
    depends_on:
      - auth-service-db

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      JWT_SECRET: dev-secret
      PGHOST: auth-service-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: auth_db
    depends_on:
      - auth-service-db

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: dev-secret
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      FHIR_SERVER_URL: http://fhir-server:8080
    depends_on:
      - auth-service
      - user-service
      - fhir-server

  fhir-server:
    build:
      context: .
      dockerfile: apps/fhir-server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8080"

volumes:
  auth-service-db-data:
