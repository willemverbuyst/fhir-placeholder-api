services:
  fhir-data-db:
    image: postgres:15
    container_name: fhir-data-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fhir_db
    ports:
      - "5432:5432"
    volumes:
      - fhir-data-db-data:/var/lib/postgresql/data

  dummy-data-cli:
    build:
      context: .
      dockerfile: cli/dummy-data-cli/Dockerfile
    depends_on:
      - fhir-data-db
    environment:
      PGHOST: fhir-data-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: fhir_db

  fhir-data-db-tool:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: fhir-data-db
    ports:
      - "9091:8080"
    depends_on:
      - fhir-data-db

  organization-reviews:
    build:
      context: .
      dockerfile: apps/organization-reviews/Dockerfile
    ports:
      - "5002:80"
    volumes:
      - ./apps/organization-reviews:/var/www/html
    depends_on:
      - organization-reviews-db
    environment:
      DB_HOST: organization-reviews-db
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: secret

  organization-reviews-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - organization_reviews_db_data:/var/lib/mysql

  organization-reviews-phpmyadmin:
    image: phpmyadmin
    ports:
      - "9092:80"
    environment:
      PMA_HOST: organization-reviews-db
    depends_on:
      - organization-reviews-db

  fhir-server:
    build:
      context: .
      dockerfile: apps/fhir-server/Dockerfile
    depends_on:
      - fhir-data-db
    environment:
      NODE_ENV: development
      PORT: "8080"
      PGHOST: fhir-data-db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: fhir_db

volumes:
  fhir-data-db-data:
  organization_reviews_db_data:
