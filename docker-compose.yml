services:
  organization-reviews:
    build:
      context: .
      dockerfile: apps/organization-reviews/Dockerfile
    ports:
      - "8081:80"
    volumes:
      - ./apps/organization-reviews:/var/www/html
    depends_on:
      - organization-reviews-db
    environment:
      DB_HOST: organization-reviews-db
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD: secret
    profiles:
      - apps
      - review

  organization-reviews-db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - organization_reviews_db_data:/var/lib/mysql
    profiles:
      - db
      - review

  organization-reviews-phpmyadmin:
    image: phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: organization-reviews-db
    depends_on:
      - organization-reviews-db
    profiles:
      - tools
      - review

  db:
    image: postgres:15
    container_name: auth_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - db

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "9090:8080"
    depends_on:
      - db
    profiles:
      - tools

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      JWT_SECRET: dev-secret
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: auth_db
    depends_on:
      - db
    profiles:
      - auth-services

  users-service:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    profiles:
      - auth-services

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: dev-secret
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      FHIR_PROXY_TARGET: http://fhir-server:8080
    depends_on:
      - auth-service
      - users-service
      - fhir-server
    profiles:
      - auth-services

  fhir-server:
    build:
      context: .
      dockerfile: apps/fhir-server/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8080"
    profiles:
      - server

volumes:
  postgres_data:
  organization_reviews_db_data:
