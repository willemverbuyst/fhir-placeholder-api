<div class="pt-4">
  <h2 class="text-2xl">Episode of Care Statuses</h2>
  <div class="relative overflow-x-auto sm:rounded-lg">
    <table class="w-full text-sm text-left text-neutral-900">
      <thead class="uppercase bg-amber-700 text-amber-400">
        <tr>
          <th scope="col" class="px-6 py-4">Code</th>
          <th scope="col" class="px-6 py-4">Display</th>
          <th scope="col" class="px-6 py-4">System</th>
        </tr>
      </thead>

      <tbody>
        {{range .Results}}
        <tr class="border-b bg-amber-800 border-amber-700 hover:bg-amber-600">
          <td class="px-6 py-4">{{.Code}}</td>
          <td class="px-6 py-4">{{.Display}}</td>
          <td class="px-6 py-4">{{.System}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
